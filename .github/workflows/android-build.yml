name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicitly install Platform 35 (compileSdk/targetSdk) and Build Tools.
      # 34.0.0 is the default Build Tools version of Android Gradle Plugin 8.7.x;
      # 35.0.0 is installed alongside it so either resolves without a download.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      - name: Verify installed SDK packages
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Only runs if gradle-wrapper.jar was not committed. It is generated by the
      # official Gradle 8.10.2 distribution and then validated in the next step.
      - name: Generate Gradle wrapper if the JAR is missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not committed; generating with Gradle 8.10.2"
            tmp="$(mktemp -d)"
            (cd "$tmp" && gradle wrapper --gradle-version 8.10.2 --distribution-type bin)
            mkdir -p gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$tmp/gradlew" ./gradlew
            cp "$tmp/gradlew.bat" ./gradlew.bat
          fi
          chmod +x ./gradlew

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@v4

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ajaz-flow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
